name: perf-ci
on:
  pull_request:
    branches:
      - 'perf/**'

permissions:
  id-token: write
  contents: read

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate benchmark entry point
        shell: bash
        run: |
          if [ ! -f ci/perf.sh ]; then
            echo "::error::Missing ci/perf.sh. Restore the actual benchmark before running performance CI."
            echo "Recovery evidence and required source: docs/performance-recovery.md"
            exit 1
          fi
          if [ ! -s ci/perf.sh ]; then
            echo "::error::Empty ci/perf.sh. Restore the actual benchmark; an empty script cannot establish performance."
            exit 1
          fi
          bash -n ci/perf.sh

      - name: Configure AWS credentials (OIDC)
        if: ${{ env.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Configure AWS credentials (fallback to static)
        if: ${{ env.AWS_ROLE_ARN == '' && env.AWS_ACCESS_KEY_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Run perf script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          chmod +x ci/perf.sh
          ./ci/perf.sh

      - name: Upload perf artifacts
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: perf-output/**
          if-no-files-found: error
          retention-days: 1
